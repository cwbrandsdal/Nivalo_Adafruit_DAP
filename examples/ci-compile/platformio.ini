; Compile-only consumer for CI. It builds this checkout of the library (the
; symlink below points at the repository root) for the ESP32 board and
; framework pins used by nivalo-esp32/examples/Esp32Stm32Bridge.

[env:featheresp32]
platform = espressif32@7.0.1
board = featheresp32
framework = arduino
lib_deps =
	symlink://../..
	adafruit/Adafruit SPIFlash@5.1.1
	adafruit/Adafruit TinyUSB Library@3.7.7
	adafruit/SdFat - Adafruit Fork@2.3.103
	fortyseveneffects/MIDI Library@5.0.2
